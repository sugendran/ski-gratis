<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, initial-scale=1" />
    <title>Ski Gratis - By Sugendran</title>
    <link rel="stylesheet" href="skifree.css" />
  </head>
  <body>
    <div id="canvas-container">
      <h1>Ski <s>Free</s> Gratis</h1>
      <canvas id="canvas" width="960" height="640"></canvas>
      <p>Use your mouse, finger, or A/S/D keys to steer. All icons are Japanese characters.</p>
      <dl class="legend">
        <dt><img src="person.png" alt="Person" /></dt>
        <dd>Person (人)</dd>
        <dt><img src="tree.png" alt="Tree" /></dt>
        <dd>Wood/Tree (木)</dd>
        <dt><img src="rock.png" alt="Rock" /></dt>
        <dd>Rock (岩)</dd>
      </dl>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
